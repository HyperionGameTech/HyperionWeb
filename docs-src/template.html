<!DOCTYPE html>
<!-- Generated file -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{headTitle}} · Hyperion Docs</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="author" content="The Hyperion Contributors">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Hyperion Engine">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{headTitle}} · Hyperion Docs">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="/assets/terrain.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/docs/docs.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="/docs/docs.js" defer></script>
  <script type="application/ld+json">{{jsonLd}}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Hyperion Engine — home"><img src="/assets/hyperion-logo.png" alt="" width="382" height="105"></a>
      <nav class="nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/#features">Features</a>
        <a href="/strata.html">Strata</a>
        <a href="/docs/" aria-current="{{docsNavCurrent}}">Docs</a>
        <a class="button button-small" href="{{engineRepo}}" rel="noopener">Code</a>
      </nav>
    </div>
  </header>

  <div class="docs-layout">
    <aside class="docs-sidebar" aria-label="Documentation">
{{sidebar}}
    </aside>

    <main id="main" class="docs-main">
{{breadcrumbs}}
      <article class="docs-article">
        <h1>{{title}}</h1>
{{lede}}
{{hero}}
{{content}}
      </article>
{{pager}}
      <p class="docs-edit"><a href="{{editUrl}}" rel="noopener">Improve this page on GitHub</a></p>
    </main>

    <aside class="docs-toc" aria-label="On this page">
{{toc}}
    </aside>
  </div>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Hyperion Engine</span>
      <nav aria-label="Footer">
        <a href="/">Home</a>
        <a href="/#features">Features</a>
        <a href="/strata.html">Strata</a>
        <a href="/docs/">Docs</a>
        <a href="{{engineRepo}}" rel="noopener">GitHub</a>
      </nav>
    </div>
  </footer>

</body>
</html>
